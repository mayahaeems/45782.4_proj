server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API routes — proxy to backend (must come before location /)
    location ~ ^/(auth|users|products|categories|cart|orders|payments|delivery|files|api|inventory-logs|category-logs)(/|$) {
        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass         http://backend:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect     off;
    }

    # React app — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
