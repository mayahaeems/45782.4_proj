version: '3.9'

services:

  # ── MySQL ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-supermarket}
      MYSQL_USER:          ${MYSQL_USER:-superuser}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-superpass}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask backend ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://${MYSQL_USER:-superuser}:${MYSQL_PASSWORD:-superpass}@db:3306/${MYSQL_DATABASE:-supermarket}?charset=utf8mb4
      SECRET_KEY:     ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-jwt-in-production}
      UPLOAD_FOLDER:  /app/instance/uploads
      CORS_ORIGINS:   http://localhost:3000
    volumes:
      - uploads:/app/instance/uploads
    ports:
      - "5000:3000"

  # ── React frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
  uploads: